name = "wind-reports"
main = "worker.mjs"
compatibility_date = "2026-11-01"

# Runs the Worker's scheduled() four times an hour, two minutes before :00/:15/:30/:45. Cron is in UTC, which doesn't matter here.
[triggers]
crons = ["13,28,43,58 * * * *"]

# Stores the logs (Hudson's history, the last 4 readings, the 24-hour histories).
# Created with:  npx wrangler kv namespace create WEATHER
[[kv_namespaces]]
binding = "WEATHER"
id = "68fa13e417e24cc4822b5dd8b431ea01"

# The wind logger: a Durable Object (SQLite) that records a Tempest's rapid wind (about every 3 s) while a session is on.
# Settings: LOGGER_STATION_ID (the station to log; or LOGGER_DEVICE_ID for the Tempest device directly).
# Secrets: TEMPEST_TOKEN (must be authorized for that station) and LOGGER_KEY (bearer token for /api/logger/start and /stop).
[[durable_objects.bindings]]
name = "LOGGER"
class_name = "WindLogger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WindLogger"]

# Visit and click counts (see worker.mjs). The dataset is created on the first write.
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "wind_reports"

[vars]
LOGGER_STATION_ID = "59196"
# Cloudflare Web Analytics site token (dash.cloudflare.com > Analytics & Logs > Web Analytics > Add a site > JS snippet:
# the 32-character value after "token"). It is public (it appears in the page), so it can live here. Empty = beacon off.
CF_BEACON_TOKEN = ""
