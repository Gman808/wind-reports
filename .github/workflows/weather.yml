name: Weather update
on:
  # The live site now runs on Cloudflare (worker.mjs, wrangler.toml). This workflow is switched off:
  # it only runs when started by hand from the Actions tab, and publishes a static copy to GitHub Pages.
  # To bring the schedule back, add under "on:":  schedule: [{ cron: "13,28,43,58 * * * *" }]
  workflow_dispatch:
    inputs:
      send:
        description: "Also send the email now"
        type: boolean
        default: false
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: weather
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Fetch weather, build site, send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEMPEST_TOKEN: ${{ secrets.CVL_2 }}
        run: node cli.mjs ${{ inputs.send && '--send' || '' }}
      - uses: actions/upload-pages-artifact@v5
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v5
