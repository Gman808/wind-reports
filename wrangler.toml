name = "wind-reports"
main = "worker.mjs"
compatibility_date = "2026-11-01"

# Runs the Worker's scheduled() four times an hour, two minutes before :00/:15/:30/:45. Cron is in UTC, which doesn't matter here.
[triggers]
crons = ["13,28,43,58 * * * *"]

# Stores the logs (Hudson's history, the last 4 readings, the 24-hour histories).
# Create it once with:  npx wrangler kv namespace create WEATHER   then paste the id it prints below.
[[kv_namespaces]]
binding = "WEATHER"
id = "REPLACE_WITH_THE_ID_FROM_wrangler_kv_namespace_create"
