name: Weather update
on:
  schedule:
    # Four times an hour, two minutes before :00/:15/:30/:45 (GitHub delays or drops runs at the exact
    # quarter-hour). Each run adds to the 'Last 4 Readings' log and Hudson's history. The email still goes out
    # only once, at 6:00 and 17:00 America/Toronto: weather.mjs checks the local hour and minute.
    - cron: "13,28,43,58 * * * *"
  workflow_dispatch:
    inputs:
      send:
        description: "Also send the email now"
        type: boolean
        default: false
permissions:
  pages: write
  id-token: write
  contents: read
concurrency:
  group: weather
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - name: Fetch weather, build site, send email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TEMPEST_TOKEN: ${{ secrets.CVL_2 }}
        run: node weather.mjs ${{ inputs.send && '--send' || '' }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
